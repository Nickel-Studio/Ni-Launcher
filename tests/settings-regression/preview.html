<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Nickel 内存条浏览器预览检查</title>
    <style>
      html,
      body,
      #root {
        height: auto;
        min-height: 100%;
      }

      body {
        overflow: auto;
        background: var(--bg);
      }

      .fixture {
        width: min(880px, calc(100% - 32px));
        margin: 16px auto 48px;
      }

      #regression-result {
        margin: var(--space-4);
        padding: var(--space-4);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text);
        white-space: pre-wrap;
        font: var(--fs-xs) / var(--lh-normal) var(--font-mono);
      }

      #regression-result[data-status="pass"] {
        color: var(--accent);
      }

      #regression-result[data-status="fail"] {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="regression-result" data-status="running" aria-live="polite">正在检查浏览器预览…</pre>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
