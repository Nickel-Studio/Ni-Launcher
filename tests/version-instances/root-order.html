<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Instance Root Addition Order Regression</title>
    <style>
      html, body { min-height: 100%; overflow: auto; background: var(--bg); }
      body { margin: 0; }
      .root-order-banner { margin: 16px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); }
      .root-order-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; margin: 16px; min-height: 600px; }
      .root-order-status { min-width: 0; padding: 16px; }
      .root-order-status input { display: block; width: 100%; margin: 8px 0; color: var(--text); background: var(--surface); border: 1px solid var(--line); padding: 8px; }
      .root-order-status output { display: block; margin: 12px 0; }
      .root-order-status pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      #root > .vs-root { min-height: 640px; margin: 16px; }
    </style>
  </head>
  <body>
    <header class="root-order-banner">Synthetic IPC fixture - production instance hook, navigation and Versions page. No native acceptance.</header>
    <div id="root"></div>
    <script type="module" src="./root-order.tsx"></script>
  </body>
</html>
