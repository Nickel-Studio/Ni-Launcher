name: CI

# 质量门禁：每次 push / PR 都跑「前端类型检查+构建」与「Rust 编译+单元测试」。
# 不做打包（打包在 build.yml 中，按需手动触发或打 tag 时触发）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端 · 类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 验证功能图标
        run: sha256sum --check tests/brand/functional-icons.sha256

      - name: 类型检查 + 生产构建
        run: pnpm build

      - name: 窗口圆角浮层回归
        run: node --test tests/window-corners/overlays.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发布安全与 portable 门禁回归（仅合成凭据）
        run: |
          node --test scripts/release-secrets.test.mjs scripts/audit-release.test.mjs tests/release-hardening/security.test.mjs
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -m unittest discover -s tests/startup-acceptance -p test_native_safety.py -v
          python -m unittest discover -s tests/release-hardening -p 'test_*.py' -v

  backend:
    name: Rust · 编译 + 单元测试
    runs-on: ubuntu-22.04
    env:
      NICKEL_CHANNEL: production
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上编译/链接所需的系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Detached Release 注入与运行时覆盖验收
        run: node tests/embedded-config/verify.mjs --fixture
