name: Build

# All four targets must include audited installers and a launcher portable archive.
# Tag builds create a draft only after the complete matrix passes the collection gate.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: 打包与审计 · ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    env:
      NICKEL_CHANNEL: production
      NICKEL_REQUIRE_RELEASE_SECRETS: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/release-build
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x64
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖与无损压缩工具（Linux）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file \
            squashfs-tools xz-utils zstd

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/release-build
          key: release-envelope-v1-${{ matrix.target }}
          # Build outputs contain recoverable decoding material; never persist target caches.
          cache-targets: "false"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查发布配置（不输出值）
        env:
          NICKEL_MSA_CLIENT_ID: ${{ secrets.NICKEL_MSA_CLIENT_ID }}
          NICKEL_MSA_AUTHORITY: ${{ vars.NICKEL_MSA_AUTHORITY }}
          NICKEL_MSA_REDIRECT_URI: ${{ vars.NICKEL_MSA_REDIRECT_URI }}
          NICKEL_CURSEFORGE_API_KEY: ${{ secrets.NICKEL_CURSEFORGE_API_KEY }}
        run: node scripts/release-secrets.mjs

      - name: 构建安装包（此步骤不创建或上传 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          NICKEL_MSA_CLIENT_ID: ${{ secrets.NICKEL_MSA_CLIENT_ID }}
          NICKEL_MSA_AUTHORITY: ${{ vars.NICKEL_MSA_AUTHORITY }}
          NICKEL_MSA_REDIRECT_URI: ${{ vars.NICKEL_MSA_REDIRECT_URI }}
          NICKEL_CURSEFORGE_API_KEY: ${{ secrets.NICKEL_CURSEFORGE_API_KEY }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked

      - name: 官方配置验收、AppImage 优化与 portable 打包
        env:
          NICKEL_MSA_CLIENT_ID: ${{ secrets.NICKEL_MSA_CLIENT_ID }}
          NICKEL_MSA_AUTHORITY: ${{ vars.NICKEL_MSA_AUTHORITY }}
          NICKEL_MSA_REDIRECT_URI: ${{ vars.NICKEL_MSA_REDIRECT_URI }}
          NICKEL_CURSEFORGE_API_KEY: ${{ secrets.NICKEL_CURSEFORGE_API_KEY }}
        run: >-
          python scripts/prepare_release.py --target ${{ matrix.target }}
          --release-dir src-tauri/target/release-build/${{ matrix.target }}/release
          --output release-upload/${{ matrix.label }}

      - name: 上传通过门禁的安装包与 portable
        uses: actions/upload-artifact@v4
        with:
          name: Nickel-${{ matrix.label }}
          if-no-files-found: error
          compression-level: 0
          path: release-upload/${{ matrix.label }}/*

  collect-release:
    name: 四目标完整性与 Release 门禁
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: Nickel-*
          path: release-inputs
      - name: 核验四目标、每目标 portable、许可和 SHA-256
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="v$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          python scripts/collect_release.py --input release-inputs --output release-assets --tag "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: Nickel-complete-release
          if-no-files-found: error
          compression-level: 0
          path: release-assets/*
      - name: 仅向 Release 草稿上传已核验产物
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft || release.assets.length) {
                throw new Error('Refusing to modify a published release or overwrite existing draft assets');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Nickel ${tag}`, draft: true, prerelease: false,
                body: 'All four targets passed configuration, portable, licensing and artifact gates.\n\nWindows: MSI / NSIS + portable ZIP.\nmacOS arm64 and x64: DMG + complete-app portable TAR.GZ.\nLinux x64: DEB / optimized AppImage + portable TAR.GZ.\n\nSee SHA256SUMS.txt. Embedded client configuration raises extraction cost, not a client-side trust boundary. Microsoft device-code preflight is not a completed account login.'
              })).data;
            }
            for (const name of fs.readdirSync('release-assets').sort()) {
              const filename = path.join('release-assets', name);
              if (!fs.statSync(filename).isFile()) throw new Error('Unexpected release asset');
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data: fs.readFileSync(filename)
              });
            }
