# Nickel-maintained fork of `minecraft-java-rs-core` 0.4.1.
# Local changes cover download mirrors, shared transfer budgets, loader resolution,
# archive validation and launch preparation; upstream attribution remains below.

[package]
name = "minecraft-java-rs-core"
version = "0.4.1"
edition = "2021"
description = "Core library for launching Minecraft Java Edition (Nickel vendored fork with BMCLAPI support)"
license = "MIT"
repository = "https://github.com/fitzxel/minecraft-java-rs-core"

[lib]
name = "minecraft_java_rs_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
flate2 = "1"
futures = "0.3"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["std"] }
sha2 = { version = "0.10", features = ["std"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
zip = "9.8"

# 与原 crate 一致的测试依赖（仅单元/集成测试使用，应用构建不会编译它们）。
[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
